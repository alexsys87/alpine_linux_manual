name: Build U-Boot (Antminer S9)

on:
  workflow_dispatch:
  push:
    paths:
      - 'uboot/antminer-s9/**'
      - 'scripts/build-uboot-antminer-s9.sh'
      - '.github/workflows/build-uboot-s9.yml'

jobs:
  uboot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev \
            libgnutls28-dev python3 python3-dev python3-setuptools swig \
            device-tree-compiler gcc-arm-linux-gnueabihf bc

      - name: Build U-Boot
        run: sh scripts/build-uboot-antminer-s9.sh

      - uses: actions/upload-artifact@v6
        with:
          name: uboot-antminer-s9
          path: |
            uboot-build/out/u-boot.elf
            uboot-build/out/u-boot.bin
